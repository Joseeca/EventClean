spring:
  application:
    name: EventClean

  datasource:
    url: jdbc:postgresql://localhost:5432/EventClean
    username: postgres
    password: admin1234
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    location: classpath:db/migration